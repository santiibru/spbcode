<!doctype html>
<!-- Fuente de public/og.png (1200×630). Regenerar con:
     msedge --headless --hide-scrollbars --window-size=1200,630 --screenshot=public/og.png scripts/og-image.html
     El contenido va centrado para que el recorte cuadrado de WhatsApp no lo corte -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
      body {
        display: grid; place-items: center;
        background: radial-gradient(ellipse 520px 380px at 50% 46%, rgba(125, 211, 168, .10), transparent 70%), #07080a;
        font-family: Menlo, "DejaVu Sans Mono", Consolas, monospace;
        color: #e8eaed;
      }
      main { display: flex; flex-direction: column; align-items: center; }
      svg { width: 210px; height: 210px; }
      h1 { margin: 40px 0 0; font-size: 100px; font-weight: 700; letter-spacing: -.02em; line-height: 1; }
      h1 span { color: #7dd3a8; }
    </style>
  </head>
  <body>
    <main>
      <!-- Último fotograma de src/assets/logo-animated.svg, con el brillo neón -->
      <svg viewBox="0 0 32 32">
        <defs>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="1.1" result="b1" />
            <feGaussianBlur in="SourceGraphic" stdDeviation="2.6" result="b2" />
            <feMerge><feMergeNode in="b2" /><feMergeNode in="b1" /></feMerge>
          </filter>
        </defs>
        <rect width="32" height="32" rx="7" fill="#0c0e11" stroke="#1c1f24" stroke-width=".3" />
        <path d="M12 10l-6 6 6 6M20 10l6 6-6 6" fill="none" stroke="#2bff94" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity=".45" filter="url(#glow)" />
        <path d="M12 10l-6 6 6 6M20 10l6 6-6 6" fill="none" stroke="#7dd3a8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <h1>spb<span>code</span></h1>
    </main>
  </body>
</html>
